<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SYSTEM RADAR CLOUD</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#050f08;
color:#00ff88;
font-family:monospace;
padding:30px;
text-align:center;
}

.card{
border:1px solid #00ff88;
padding:20px;
margin:10px auto;
max-width:700px;
}

.big{
font-size:30px;
}

#radarCanvas{
margin:20px auto;
display:block;
border-radius:50%;
border:1px solid #00ff88;
background:#031108;
box-shadow:0 0 20px #00ff8844;
}

#eventLog{
text-align:left;
max-height:300px;
overflow-y:auto;
font-size:14px;
}

.log-entry{
padding:8px;
border-bottom:1px solid #003322;
}

</style>

</head>
<body>

<h1>SYSTEM RADAR CLOUD</h1>

<canvas id="radarCanvas" width="300" height="300"></canvas>


<div class="card">
<div>PIR</div>
<div id="pir" class="big">---</div>
</div>

<div class="card">
<div>DISTANCIA</div>
<div id="dist" class="big">---</div>
</div>

<div class="card">
<div>LUZ</div>
<div id="light" class="big">---</div>
</div>

<div class="card">
<div>ANGULO</div>
<div id="angle" class="big">---</div>
</div>


<div class="card">

<h2>EVENT LOG</h2>

<div id="eventLog"></div>

</div>


<div class="card">

<h2>TELEMETRÍA</h2>

<canvas id="chart"></canvas>

</div>


<script>

//=====================================
// FIREBASE
//=====================================
const firebaseConfig = {

apiKey: "AIzaSyDAvXDdNoihjD-eMlTxheHeFL2akTpPeFI",

authDomain: "kazthor-radar-cloud-39fe2.firebaseapp.com",

databaseURL: "https://kazthor-radar-cloud-39fe2-default-rtdb.firebaseio.com",

projectId: "kazthor-radar-cloud-39fe2",

storageBucket: "kazthor-radar-cloud-39fe2.firebasestorage.app",

messagingSenderId: "402412177896",

appId: "1:402412177896:web:702741d848cd97a69e3c5d"

};

firebase.initializeApp(
firebaseConfig
);

const db =
firebase.database();


//=====================================
// RADAR
//=====================================
const canvas =
document.getElementById("radarCanvas");

const ctx =
canvas.getContext("2d");

const eventLog =
document.getElementById("eventLog");

const CX = 150;
const CY = 150;
const R  = 140;

let lastAngle = 0;
let lastDist = 999;

let lastAlert = 0;


//=====================================
// CHART
//=====================================
const labels = [];
const distData = [];
const lightData = [];

const chart = new Chart(

document.getElementById("chart"),

{
type:'line',

data:{
labels:labels,

datasets:[

{
label:'Distancia',
data:distData
},

{
label:'Luz',
data:lightData
}

]
},

options:{
animation:false,
responsive:true
}

});


//=====================================
// EVENT LOG
//=====================================
function addLog(text){

const now =
new Date()
.toLocaleTimeString();

const entry =
document.createElement("div");

entry.className =
"log-entry";

entry.innerHTML =
"["+now+"] "+text;

eventLog.prepend(entry);


while(
eventLog.children.length > 30
){

eventLog.removeChild(
eventLog.lastChild
);

}

}


//=====================================
// MQTT
//=====================================
const client = mqtt.connect(

'wss://0d6666edf86b49058c829f4e72fa5d76.s1.eu.hivemq.cloud:8884/mqtt',

{
username:'esp32',
password:'Esp32Cloude11',
clientId:'web-'+Math.random()
}

);


client.on('connect', ()=>{

console.log("MQTT conectado");

addLog(
"SISTEMA CLOUD ONLINE"
);

client.subscribe(
'kazthor/radar/data'
);

});


//=====================================
// DATOS
//=====================================
client.on('message',(topic,msg)=>{

const d =
JSON.parse(
msg.toString()
);


//-------------------------
// FIREBASE LIVE
//-------------------------
db.ref(
"radar/live"
).set({

pir:d.pir,

dist:d.dist,

light:d.light,

angle:d.angle,

timestamp:Date.now()

});


//-------------------------
// RADAR
//-------------------------
lastAngle =
d.angle;

lastDist =
d.dist;


//-------------------------
// UI
//-------------------------
document.getElementById("pir").innerHTML =
d.pir;

document.getElementById("dist").innerHTML =
d.dist+" cm";

document.getElementById("light").innerHTML =
d.light;

document.getElementById("angle").innerHTML =
d.angle+"°";


//-------------------------
// CHART
//-------------------------
const time =
new Date()
.toLocaleTimeString();

labels.push(time);

distData.push(
d.dist
);

lightData.push(
d.light
);


if(
labels.length>20
){

labels.shift();

distData.shift();

lightData.shift();

}

chart.update();


//-------------------------
// ALERTAS
//-------------------------
const alert =

d.pir==1 ||

(
d.dist>=5 &&
d.dist<=100
);


if(
alert &&
Date.now()-lastAlert>2000
){

lastAlert =
Date.now();


addLog(

"ALERTA → "+d.dist+" cm"

);


//-------------------------
// FIREBASE EVENTS
//-------------------------
db.ref(
"radar/events"
).push({

type:"alert",

pir:d.pir,

dist:d.dist,

light:d.light,

angle:d.angle,

timestamp:Date.now()

});

}

});


//=====================================
// CANVAS
//=====================================
function drawRadar(){

ctx.clearRect(
0,
0,
300,
300
);


ctx.strokeStyle =
"#00ff88";


for(
let i=1;
i<=4;
i++
){

ctx.beginPath();

ctx.arc(

CX,
CY,

(R/4)*i,

0,
Math.PI*2

);

ctx.stroke();

}


ctx.beginPath();

ctx.moveTo(
CX-R,
CY
);

ctx.lineTo(
CX+R,
CY
);

ctx.moveTo(
CX,
CY-R
);

ctx.lineTo(
CX,
CY+R
);

ctx.stroke();


const rad =

(lastAngle-90)*
Math.PI/180;


ctx.beginPath();

ctx.moveTo(
CX,
CY
);

ctx.lineTo(

CX + R*Math.cos(rad),

CY + R*Math.sin(rad)

);

ctx.stroke();


// ECO
if(
lastDist>0 &&
lastDist<250
){

const echoR =

(lastDist/250)*R;


const ex =

CX +
echoR*Math.cos(rad);


const ey =

CY +
echoR*Math.sin(rad);


ctx.fillStyle =
"#ff3355";


ctx.beginPath();

ctx.arc(

ex,
ey,

6,

0,
Math.PI*2

);

ctx.fill();

}


requestAnimationFrame(
drawRadar
);

}


drawRadar();

</script>

</body>
</html>
